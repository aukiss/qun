<script>
(function(){
  const $ = (s)=>document.querySelector(s);
  const list = $('#list'), stat=$('#stat'), score=$('#score');
  const showAllBtn=$('#showAll'), checkBtn=$('#check'), resetBtn=$('#reset');
  const genBtn=$('#gen'), exportDocBtn=$('#exportDoc'), exportPdfBtn=$('#exportPdf');
  const toastEl=$('#toast'); const modeTag=$('#modeTag');
  const btnGrammar=$('#btnGrammar'), btnTense=$('#btnTense');

  let data=null, userAns={}, mode='grammar';

  function toast(msg, ms=2200){ toastEl.textContent=msg; toastEl.style.display='block'; setTimeout(()=>toastEl.style.display='none',ms); }
  function getTypes(){ const sel=Array.from($('#types').selectedOptions||[]).map(o=>o.value); return sel.length? sel : ['choice','error','transform','fill','rearrange','reading']; }

  function setMode(m){
    mode = m;
    if(m==='grammar'){
      btnGrammar.classList.add('btn-primary'); btnGrammar.classList.remove('btn-ghost');
      btnTense.classList.add('btn-ghost'); btnTense.classList.remove('btn-primary');
      modeTag.textContent='当前模式：语法综合';
    }else{
      btnTense.classList.add('btn-primary'); btnTense.classList.remove('btn-ghost');
      btnGrammar.classList.add('btn-ghost'); btnGrammar.classList.remove('btn-primary');
      modeTag.textContent='当前模式：时态专项';
    }
  }
  btnGrammar.addEventListener('click', ()=> setMode('grammar'));
  btnTense.addEventListener('click', ()=> setMode('tense'));

  function qEl(q, idx){
    const wrap=document.createElement('div'); wrap.className='q';
    const title=document.createElement('h3'); title.innerHTML=`${q.stem} <span class="badge">${q.type}</span>`; wrap.appendChild(title);
    if(q.options?.length){
      // 取消 A/B/C/D 标签，在导出和页面都以圆点展示
      const ul=document.createElement('ul'); ul.style.margin='8px 0'; ul.style.paddingLeft='18px';
      q.options.forEach(opt=>{ const li=document.createElement('li'); li.className='opt'; li.innerHTML=`<label><input type="radio" name="q${idx}" value="${opt.value}" /> ${opt.text}</label>`; li.addEventListener("change", (e)=>{ ul.querySelectorAll(".opt").forEach(x=>x.classList.remove("selected")); li.classList.add("selected");}); ul.appendChild(li); });
      wrap.appendChild(ul);
    }else{
      const inp=document.createElement('input'); inp.placeholder='在这里作答'; inp.style.marginTop='6px'; inp.addEventListener('input', e=> userAns[idx]=(e.target.value||'').trim()); wrap.appendChild(inp);
    }
    const ans=document.createElement('div'); ans.className='ans'; ans.innerHTML=`
      <div><strong>参考答案：</strong> ${Array.isArray(q.answer)? q.answer.join(' / ') : (q.answer ?? '—')}</div>
      <div style="margin-top:6px"><strong>解析思路：</strong><br>${(q.explain||'—').replaceAll('\\n','<br>')}</div>
      ${q.hint? `<div style="margin-top:6px" class="small muted"><strong>提示：</strong>${q.hint}</div>`:''}`;
    wrap.appendChild(ans);
    wrap.addEventListener('change', (e)=>{ if(e.target && e.target.name===`q${idx}`){ userAns[idx]=e.target.value; } });
    title.style.cursor='pointer'; title.title='点击展开/收起解析'; title.addEventListener('click', ()=> ans.classList.toggle('show'));
    return wrap;
  }

  function renderList(){
    list.innerHTML='';
    if(!data?.items?.length){ list.innerHTML='<div class="muted">没有题目，请重新生成。</div>'; return; }
    data.items.forEach((q,idx)=> list.appendChild(qEl(q, idx)));
    checkBtn.disabled=false; resetBtn.disabled=false; showAllBtn.disabled=false;
    stat.textContent=`已生成 ${data.items.length} 题`;
  }

  function toggleAllExplain(){ const blocks=list.querySelectorAll('.ans'); const anyHidden=Array.from(blocks).some(b=>!b.classList.contains('show')); blocks.forEach(b=> b.classList.toggle('show', anyHidden)); }
  function judgeOne(q, ua){ const norm=v=>(v??'').toString().trim().toLowerCase(); if(q.type==='choice'||q.type==='reading'){ return norm(ua) && norm(ua)===norm(q.answer);} if(Array.isArray(q.answer)) return q.answer.map(norm).includes(norm(ua)); if(typeof q.answer==='string') return norm(ua)===norm(q.answer); return false; }
  function doCheck(){ if(!data?.items) return; let right=0,total=data.items.length; data.items.forEach((q,idx)=>{ const ua=userAns[idx]; const correct=judgeOne(q,ua); const block=list.children[idx]; const title=block.querySelector('h3'); const ans=block.querySelector('.ans'); ans.classList.add('show'); title.querySelector('.badge')?.remove(); const badge=document.createElement('span'); badge.className='badge '+(correct?'ok':'err'); badge.textContent=correct?'✓ 正确':'✗ 错误'; title.appendChild(badge);
      // 给选择题的选中项上色
      if(q.options?.length){ const ul=block.querySelector('ul'); if(ul){ const chosen = (userAns[idx]||'').toString().toUpperCase(); ul.querySelectorAll('.opt').forEach(li=>{ const v = (li.querySelector('input')?.value||'').toUpperCase(); li.classList.remove('good','bad'); if(v===chosen){ li.classList.add(correct? 'good':'bad'); } }); } }
      if(correct) right++; }); score.textContent=`本次得分：${right} / ${total}（${Math.round(right/total*100)}分）`; }

  function htmlForExport(includeAnswer=true){
    const time=new Date().toLocaleString();
    let html='<h2 style="margin:0 0 8px">译林版六年级英语 语法练习</h2>';
    html += '<div style="font-size:12px;color:#666">导出时间：'+time+'</div>';
    html += '<div style="font-size:12px;color:#666">模式：'+(mode==='tense'?'时态专项':'语法综合')+'</div>';
    if(!data?.items?.length){
      html += '<p>（尚未生成题目，此为占位导出。）</p>';
      return html;
    }
    // 不使用 <ol> 避免 1,2,3… 序号；使用分隔线和项目块
    data.items.forEach((q, idx)=>{
      html += '<div style="margin:12px 0; padding:10px; border:1px solid #ddd; border-radius:10px">';
      html += '<div><strong>'+q.stem+'</strong></div>';
      if(q.options?.length){
        html += '<ul style="margin:6px 0 0 18px; padding:0">';
        q.options.forEach(o=>{ html += '<li style="margin:3px 0">'+o.text+'</li>'; });
        html += '</ul>';
      }
      if(includeAnswer){
        html += '<div style="margin-top:6px"><em>答案：</em> '+(Array.isArray(q.answer)? q.answer.join(' / ') : q.answer)+'</div>';
        html += '<div style="margin-top:4px"><em>解析：</em> '+(q.explain||'').replaceAll('\\n','<br>')+'</div>';
      } else {
        html += '<div style="margin-top:8px;height:22px;border-bottom:1px solid #ccc;width:60%"></div>';
      }
      html += '</div>';
    });
    return html;
  }

  function exportWord(){
    const withAns = confirm('导出 Word 时是否包含答案与解析？\n“确定”包含；“取消”只导出题目。');
    const html = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
      <head><meta charset="utf-8"><title>英语练习</title>
<style>
/* --- Print rules for PDF export (v10.2) --- */
@media print {
  body { background:#fff !important; }
  header, .controls, #toast, #modeTag, #check, #reset, #showAll, #exportDoc, #exportPdf { display:none !important; }
  /* each question card */
  .q { page-break-inside: avoid; border-color:#ddd !important; }
  /* 5 questions per page */
  .q:nth-child(5n) { page-break-after: always; }
  /* answers visibility controlled by body class */
  body.paper-noans .ans { display:none !important; }
  body.paper-ans .ans { display:block !important; }
}
</style>

</head>
      <body>${htmlForExport(withAns)}</body></html>`;
    const blob = new Blob([html], { type: 'application/msword' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '译林六年级英语练习.doc';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },0);
    toast('已触发 Word 下载');
  }

  async 
function exportPdf(){
  try{
    const withAns = confirm('导出 PDF 时是否包含答案与解析？
“确定”包含；“取消”只导出题目。');
    // Set filename via document.title so most browsers use it as default
    const oldTitle = document.title;
    const d = new Date(); const pad = n=>String(n).padStart(2,'0');
    const date = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
    const name = withAns ? `${date}-解析` : `${date}-试卷`;
    document.title = name;
    document.body.classList.remove('paper-noans','paper-ans');
    document.body.classList.add(withAns? 'paper-ans':'paper-noans');
    window.print();
    setTimeout(()=>{ document.body.classList.remove('paper-noans','paper-ans'); document.title = oldTitle; }, 200);
  }catch(e){
    alert('导出失败：' + (e && e.message ? e.message : e));
  }
}
const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit:'pt', format:'a4' });
      const pageWidth = doc.internal.pageSize.getWidth();
      const margin = 40;
      const maxWidth = pageWidth - margin*2;

      const temp = document.createElement('div');
      temp.style.visibility='hidden';
      temp.style.position='fixed';
      temp.style.left='-9999px';
      temp.innerHTML = htmlForExport(withAns);
      document.body.appendChild(temp);
      const text = temp.innerText; // 已无数字序号
      document.body.removeChild(temp);

      const lines = doc.splitTextToSize(text, maxWidth);
      let y = 50;
      const lineHeight = 16;
      lines.forEach(line => {
        if(y > 780){ doc.addPage(); y = 50; }
        doc.text(line, margin, y);
        y += lineHeight;
      });
      doc.save('译林六年级英语练习.pdf');
      toast('已触发 PDF 下载');
    }catch(e){
      toast('PDF 导出失败：'+e.message);
      console.error(e);
    }
  }

  async function gen(){
    const count = Math.max(1, Math.min(20, +($('#count').value||10)));
    const types = getTypes(); const level=$('#level').value; const focus=($('#focus').value||'').trim();
    genBtn.disabled=true; genBtn.textContent='⏳ 正在出题…'; list.innerHTML='<div class="muted">正在生成题目，请稍候…</div>'; stat.textContent=''; userAns={}; score.textContent='';
    try{
      const paths=['/api/tutor','/.netlify/functions/tutor']; let ok=false,lastErr=null,res,txt;
      for(const p of paths){
        try{
          res=await fetch(p,{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ count, types, level, focus, mode }) });
          if(res.ok){ ok = true; break; }
          txt = await res.text().catch(()=> ''); lastErr = new Error(`HTTP ${res.status} ${res.statusText}: ${txt}`);
        }catch(e){ lastErr=e; }
      }
      if(!ok) throw lastErr || new Error('无法访问后端函数');
      data = await res.json();
      if(!data?.items || !Array.isArray(data.items)){ throw new Error('返回数据不是 items 数组，请检查后端提示。'); }
      renderList(); toast('已生成题目');
    }catch(err){ console.error(err); list.innerHTML = `<div style="color:#ffb4c0">出题失败：${err.message}</div>`; toast('出题失败：'+err.message); }
    finally{ genBtn.disabled=false; genBtn.textContent='📝 一键出题'; }
  }

  $('#gen').addEventListener('click', gen);
  $('#showAll').addEventListener('click', ()=>{ const blocks=list.querySelectorAll('.ans'); const anyHidden=Array.from(blocks).some(b=>!b.classList.contains('show')); blocks.forEach(b=> b.classList.toggle('show', anyHidden)); });
  $('#check').addEventListener('click', ()=>{ if(!data?.items) return; let right=0,total=data.items.length; data.items.forEach((q,idx)=>{ const ua=userAns[idx]; const correct=(function(q,ua){ const n=v=>(v??'').toString().trim().toLowerCase(); if(q.type==='choice'||q.type==='reading'){ return n(ua) && n(ua)===n(q.answer);} if(Array.isArray(q.answer)) return q.answer.map(n).includes(n(ua)); if(typeof q.answer==='string') return n(ua)===n(q.answer); return false; })(q,ua); const block=list.children[idx]; const title=block.querySelector('h3'); const ans=block.querySelector('.ans'); ans.classList.add('show'); title.querySelector('.badge')?.remove(); const badge=document.createElement('span'); badge.className='badge '+(correct?'ok':'err'); badge.textContent=correct?'✓ 正确':'✗ 错误'; title.appendChild(badge);
      // 给选择题的选中项上色
      if(q.options?.length){ const ul=block.querySelector('ul'); if(ul){ const chosen = (userAns[idx]||'').toString().toUpperCase(); ul.querySelectorAll('.opt').forEach(li=>{ const v = (li.querySelector('input')?.value||'').toUpperCase(); li.classList.remove('good','bad'); if(v===chosen){ li.classList.add(correct? 'good':'bad'); } }); } }
      if(correct) right++; }); score.textContent=`本次得分：${right} / ${total}（${Math.round(right/total*100)}分）`; });
  $('#reset').addEventListener('click', ()=>{ userAns={}; score.textContent=''; if(data) renderList(); });
  $('#exportDoc').addEventListener('click', exportWord);
  $('#exportPdf').addEventListener('click', exportPdf);
  // default mode
  setMode('grammar');
})();
</script>
