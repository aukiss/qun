<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>六年级英语出题器 · 语法与时态</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <h1>🎓 六年级英语出题器</h1>
      <p class="sub">@凉风有信开发 反馈请联系微信wuliaotop</p>
    </header>

    <section class="controls card">
      <div class="row">
        <label class="field">
          <span>题量</span>
          <select id="questionCount">
            <option value="10" selected>10 题</option>
            <option value="15">15 题</option>
            <option value="20">20 题</option>
          </select>
        </label>

        <label class="field">
          <span>难度</span>
          <select id="difficulty">
            <option value="basic" selected>基础</option>
            <option value="intermediate">提高</option>
            <option value="challenge">挑战</option>
          </select>
        </label>

        <label class="field grow">
          <span>知识点（可选）</span>
          <select id="topic">
            <option value="">不限</option>
            <option value="subject-verb agreement">主谓一致</option>
            <option value="pronouns">代词</option>
            <option value="prepositions">介词</option>
            <option value="articles">冠词</option>
            <option value="comparatives">比较级入门</option>
            <option value="present simple">一般现在时</option>
            <option value="past simple">一般过去时</option>
            <option value="present continuous">现在进行时</option>
            <option value="future simple">一般将来时</option>
          </select>
        </label>

        <label class="field">
          <span>出题形式</span>
          <select id="formType">
            <option value="mcq">选择题</option>
            <option value="short">填空/简答</option>
            <option value="mixed" selected>混合</option>
          </select>
        </label>

        <label class="field">
          <span>试卷编号</span>
          <select id="paperCode">
            <option value="A" selected>A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </label>
      </div>

      <div class="row">
        <div class="btn-group">
          <button id="btnGrammar" class="btn pill primary">📘 语法</button>
          <button id="btnTenses" class="btn pill accent">⏰ 时态</button>
          <button id="generateBtn" class="btn solid large">🪄 一键生成</button>
        </div>
        <div class="btn-group right">
          <button id="exportPaperBtn" class="btn outline large" disabled>🖨️ 导出试卷</button>
          <button id="exportPaperSolBtn" class="btn outline large" disabled>🖨️ 导出试卷+解析</button>
        </div>
      </div>

      <div class="row wrap">
        <div class="mini-group">
          <button id="startQuizBtn" class="btn ghost">▶️ 在线做题</button>
          <button id="gradeQuizBtn" class="btn ghost">✅ 在线批改</button>
          <button id="resetBtn" class="btn ghost">🔄 重置</button>
        </div>
        <div class="mini-group">
          <button id="viewWrongBtn" class="btn ghost">📚 查看错题本</button>
          <button id="exportWrongPdfBtn" class="btn ghost">🖨️ 错题本PDF</button>
          <button id="clearWrongBtn" class="btn ghost danger">🗑️ 清空错题本</button>
        </div>
      </div>
    </section>

    <section class="stats card" id="statsBar" style="display:none;">
      <div><strong>本次成绩：</strong><span id="statAcc">-</span>；<span id="statCount">-</span></div>
      <div id="statTopics" class="muted small"></div>
    </section>

    <section id="questionsContainer" class="questions">
      <p class="muted">选择条件后，点“🪄 一键生成”。</p>
    </section>
  </main>

  <footer class="foot muted">
    <p>为小学生设计：按钮大、字号清晰、适配平板与手机。</p>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
